# Settings for Backend (on Cloud Run).
# See https://firebase.google.com/docs/app-hosting/configure#cloud-run
runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpu: 2
  memoryMiB: 1024

# Environment variables and secrets.
env:
  # Firebase Public Configuration (available at BUILD and RUNTIME)
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyBJ9n3Mjqx0Ol6FSg35i8fTFRxnnRjzHmE
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: honestlyhousing-4d7f0.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: honestlyhousing-4d7f0
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: honestlyhousing-4d7f0.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "656663435593"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:656663435593:web:db9225035ee4c73ec4e298
    availability:
      - BUILD
      - RUNTIME

  # Server-side Configuration (RUNTIME only for security)
  - variable: FIREBASE_ADMIN_PROJECT_ID
    value: honestlyhousing-4d7f0
    availability:
      - RUNTIME

  - variable: FIREBASE_ADMIN_CLIENT_EMAIL
    value: firebase-adminsdk-fbsvc@honestlyhousing-4d7f0.iam.gserviceaccount.com
    availability:
      - RUNTIME

  # Secret for Firebase Admin Private Key
  - variable: FIREBASE_ADMIN_PRIVATE_KEY
    secret: firebase-admin-private-key
    availability:
      - RUNTIME
  - variable: RAINFOREST_API_KEY
    secret: rainforest-api-key
